<section class="auth-wrap page">
  <div class="auth-card card">
    <h1 class="auth-title">Nova lozinka</h1>
    <p class="text-muted auth-sub">Unesite novu lozinku za svoj nalog.</p>

    @if (error()) {
      <div class="alert alert-error">{{ error() }}</div>
    }
    @if (message()) {
      <div class="alert alert-success">{{ message() }}</div>
    }

    <form (ngSubmit)="submit()" class="auth-form">
      <div class="form-field">
        <label for="pass">Nova lozinka</label>
        <input
          id="pass"
          type="password"
          name="pass"
          autocomplete="new-password"
          [(ngModel)]="password"
        />
        <p class="form-hint text-muted">
          8–12 karaktera, počinje slovom, bar jedno veliko slovo, cifra i specijalni znak.
        </p>
      </div>

      <div class="form-field">
        <label for="confirm">Potvrdi lozinku</label>
        <input
          id="confirm"
          type="password"
          name="confirm"
          autocomplete="new-password"
          [(ngModel)]="confirm"
        />
      </div>

      <button type="submit" class="btn btn-primary btn-block" [disabled]="loading()">
        {{ loading() ? 'Čuvanje…' : 'Sačuvaj lozinku' }}
      </button>
    </form>

    <div class="auth-links">
      <a routerLink="/login">Nazad na prijavu</a>
    </div>
  </div>
</section>
