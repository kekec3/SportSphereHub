<section class="auth-wrap page">
  <div class="auth-card card">
    <h1 class="auth-title">Prijava</h1>
    <p class="text-muted auth-sub">Dobrodošli nazad — prijavite se na svoj nalog.</p>

    @if (error()) {
      <div class="alert alert-error">{{ error() }}</div>
    }

    <form (ngSubmit)="submit()" class="auth-form">
      <div class="form-field">
        <label for="username">Korisničko ime</label>
        <input
          id="username"
          type="text"
          name="username"
          autocomplete="username"
          [(ngModel)]="username"
        />
      </div>

      <div class="form-field">
        <label for="password">Lozinka</label>
        <input
          id="password"
          type="password"
          name="password"
          autocomplete="current-password"
          [(ngModel)]="password"
        />
      </div>

      <button type="submit" class="btn btn-primary btn-block" [disabled]="loading()">
        {{ loading() ? 'Prijavljivanje…' : 'Prijavi se' }}
      </button>
    </form>

    <div class="auth-links">
      <a routerLink="/forgot-password">Zaboravljena lozinka?</a>
      <span>Nemate nalog? <a routerLink="/register">Registrujte se</a></span>
    </div>
  </div>
</section>
