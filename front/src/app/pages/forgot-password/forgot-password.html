<section class="auth-wrap page">
  <div class="auth-card card">
    <h1 class="auth-title">Zaboravljena lozinka</h1>
    <p class="text-muted auth-sub">Unesite korisničko ime ili email da dobijete link za reset.</p>

    @if (error()) {
      <div class="alert alert-error">{{ error() }}</div>
    }
    @if (message()) {
      <div class="alert alert-success">{{ message() }}</div>
    }

    @if (resetLink()) {
      <div class="reset-link-box">
        <p>Link za reset lozinke (simulacija emaila):</p>
        <a [routerLink]="resetPath()">Otvori stranicu za reset →</a>
      </div>
    }

    <form (ngSubmit)="submit()" class="auth-form">
      <div class="form-field">
        <label for="uoe">Korisničko ime ili email</label>
        <input id="uoe" type="text" name="uoe" [(ngModel)]="usernameOrEmail" />
      </div>

      <button type="submit" class="btn btn-primary btn-block" [disabled]="loading()">
        {{ loading() ? 'Slanje…' : 'Pošalji link' }}
      </button>
    </form>

    <div class="auth-links">
      <a routerLink="/login">Nazad na prijavu</a>
    </div>
  </div>
</section>
